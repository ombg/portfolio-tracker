# Local stack (specs/architecture.md). M1: database and portfolio-api.
# web (Caddy), importer, market-data and backup join in later milestones.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    # Published on localhost only until Caddy fronts it.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
