# Local stack (specs/architecture.md): database, portfolio-api, importer, market-data and web (Caddy + SPA).
# backup joins in a later milestone.
#
# Networks (D-39): every service is on `backend`, which has no route to the internet. Only market-data is also on
# `egress` (Yahoo, Bank of Canada) and only web on `edge`, which publishes its port on 127.0.0.1.
networks:
  backend:
    internal: true
  egress: {}
  edge: {}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # web serves plain HTTP on 127.0.0.1, where Safari drops Secure cookies, so the default is false (D-34).
      # Set COOKIE_SECURE=true as soon as the app is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Set as the pt_importer role's password after migrations (D-35).
      IMPORTER_DB_PASSWORD: ${IMPORTER_DB_PASSWORD:?set IMPORTER_DB_PASSWORD in .env}
      # Uploads and preview corrections go to the importer with this token (D-35, D-36).
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      IMPORTER_URL: http://importer:8000
      # Set as the pt_market role's password after migrations (D-39).
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD:?set MARKET_DB_PASSWORD in .env}
      MARKET_DATA_URL: http://market-data:8000
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    # Not published: the browser reaches the API only through web (D-16).

  importer:
    build:
      context: services/importer
      target: runtime
    environment:
      DB_HOST: db
      DB_PASSWORD: ${IMPORTER_DB_PASSWORD:?set IMPORTER_DB_PASSWORD in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      FILES_DIR: /data/files
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started  # api enables the pt_importer login after migrating
    networks: [backend]
    # Not published: only portfolio-api calls it, with the service token (D-16).

  market-data:
    build:
      context: services/market-data
      target: runtime
    environment:
      DB_HOST: db
      DB_PASSWORD: ${MARKET_DB_PASSWORD:?set MARKET_DB_PASSWORD in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      # yahoo (default) | fixture (recorded responses, tests) | off (no requests at all; no prices) (D-39)
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started  # api enables the pt_market login after migrating
    restart: unless-stopped  # retries until api has enabled the login on a first start
    networks: [backend, egress]
    # Not published: only portfolio-api calls it, with the service token. It sends ticker symbols and currency
    # pairs to the providers, nothing else (D-39).

  web:
    build:
      context: services/web
    depends_on:
      - api
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  files:
